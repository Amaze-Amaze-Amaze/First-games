<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Canvas Tower Defense</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        header {
            margin-bottom: 10px;
            text-align: center;
        }
        #ui {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        canvas {
            background-color: #2e4a2e;
            border: 4px solid #444;
            cursor: pointer;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tower Defense: Escalation</h1>
    </header>

    <div id="ui">
        <div>Gold: <span id="goldVal">150</span></div>
        <div>Base Health: <span id="healthVal">10</span></div>
        <div>Wave: <span id="waveVal">1</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls">
        <button id="buyTowerBtn">Buy Tower (Cost: 50)</button>
        <button id="nextWaveBtn">Start Next Wave</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const goldValEl = document.getElementById('goldVal');
        const healthValEl = document.getElementById('healthVal');
        const waveValEl = document.getElementById('waveVal');
        const buyTowerBtn = document.getElementById('buyTowerBtn');
        const nextWaveBtn = document.getElementById('nextWaveBtn');

        let gold = 150;
        let baseHealth = 10;
        let wave = 1;
        let enemiesToSpawn = 0;
        let spawnTimer = 0;

        const path = [
            { x: 0, y: 250 },
            { x: 200, y: 250 },
            { x: 200, y: 100 },
            { x: 500, y: 100 },
            { x: 500, y: 400 },
            { x: 700, y: 400 },
            { x: 700, y: 250 },
            { x: 800, y: 250 }
        ];

        let towers = [];
        let enemies = [];
        let projectiles = [];
        let selectedTool = 'tower';

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (selectedTool === 'tower' && gold >= 50) {
                // Check if too close to path or other towers
                let valid = true;
                for (let t of towers) {
                    const dist = Math.hypot(t.x - x, t.y - y);
                    if (dist < 30) valid = false;
                }
                if (valid) {
                    towers.push({ x, y, range: 100, damage: 25, coolDown: 0 });
                    gold -= 50;
                    updateUI();
                }
            }
        });

        nextWaveBtn.addEventListener('click', () => {
            if (enemiesToSpawn === 0 && enemies.length === 0) {
                enemiesToSpawn = 5 + wave * 3;
                waveValEl.innerText = wave;
            }
        });

        function updateUI() {
            goldValEl.innerText = gold;
            healthValEl.innerText = baseHealth;
            waveValEl.innerText = wave;
        }

        class Enemy {
            constructor(waveNum) {
                this.index = 0;
                this.x = path[0].x;
                this.y = path[0].y;
                this.speed = 1 + waveNum * 0.2;
                this.maxHealth = 40 + waveNum * 15;
                this.health = this.maxHealth;
                this.reward = 10 + waveNum * 2;
            }

            update() {
                const target = path[this.index + 1];
                if (!target) return;

                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.index++;
                    if (this.index >= path.length - 1) {
                        baseHealth--;
                        updateUI();
                        this.dead = true;
                        if (baseHealth <= 0) {
                            alert('Game Over! Your base has fallen.');
                            location.reload();
                        }
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }

            draw() {
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
                ctx.fill();

                // Health bar
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x - 12, this.y - 20, 24, 4);
                ctx.fillStyle = '#0f0';
                ctx.fillRect(this.x - 12, this.y - 20, 24 * (this.health / this.maxHealth), 4);
            }
        }

        function gameLoop() {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Path
            ctx.strokeStyle = '#5c8a5c';
            ctx.lineWidth = 32;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // Spawn logic
            if (enemiesToSpawn > 0) {
                spawnTimer++;
                if (spawnTimer > 60) {
                    enemies.push(new Enemy(wave));
                    enemiesToSpawn--;
                    spawnTimer = 0;
                }
            } else if (enemies.length === 0 && waveValEl.innerText > 0 && enemiesToSpawn === 0) {
                // Wave cleared check
                if (wave > 1 || baseHealth < 10) {
                    // check if wave just finished
                }
            }

            if (enemiesToSpawn === 0 && enemies.length === 0 && nextWaveBtn.disabled) {
                wave++;
                gold += 50;
                updateUI();
                nextWaveBtn.disabled = false;
            } else if (enemiesToSpawn > 0 || enemies.length > 0) {
                nextWaveBtn.disabled = true;
            }

            // Update & Draw Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const en = enemies[i];
                en.update();
                if (en.dead) {
                    if (en.health <= 0) {
                        gold += en.reward;
                        updateUI();
                    }
                    enemies.splice(i, 1);
                } else {
                    en.draw();
                }
            }

            // Towers logic
            for (let t of towers) {
                // Draw range (optional, faint)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
                ctx.stroke();

                // Draw tower base
                ctx.fillStyle = '#3399ff';
                ctx.beginPath();
                ctx.arc(t.x, t.y, 15, 0, Math.PI * 2);
                ctx.fill();

                if (t.coolDown > 0) t.coolDown--;

                // Target enemy
                if (t.coolDown <= 0) {
                    let closest = null;
                    let minDist = t.range;
                    for (let en of enemies) {
                        const dist = Math.hypot(en.x - t.x, en.y - t.y);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = en;
                        }
                    }

                    if (closest) {
                        closest.health -= t.damage;
                        t.coolDown = 30; // fire rate
                        projectiles.push({ x1: t.x, y1: t.y, x2: closest.x, y2: closest.y, life: 5 });
                    }
                }
            }

            // Draw projectiles (lasers)
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x1, p.y1);
                ctx.lineTo(p.x2, p.y2);
                ctx.stroke();
                p.life--;
                if (p.life <= 0) projectiles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
